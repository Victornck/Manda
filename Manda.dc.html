<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'General Sans',system-ui,sans-serif;color:#0A0A0A;background:#FFFFFF;-webkit-font-smoothing:antialiased}
  a{color:#0A0A0A;text-decoration:none}
  a:hover{color:#D97757}
  ::selection{background:#FBDDD1;color:#0A0A0A}
  @keyframes mandaFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">

  <sc-if value="{{ showMarketingNav }}" hint-placeholder-val="{{ true }}">
    <header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid #EDEDED">
      <div style="max-width:1120px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between">
        <a href="#" onClick="{{ goLanding }}" style="display:flex;align-items:center;gap:9px">
          <span style="width:28px;height:28px;border-radius:8px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Satoshi',sans-serif;font-weight:900;font-size:17px;line-height:1">M</span>
          <span style="font-family:'Satoshi',sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.02em">Manda</span>
        </a>
        <nav style="display:flex;align-items:center;gap:8px">
          <a href="#" onClick="{{ goPricing }}" style="font-size:14.5px;font-weight:500;color:#3F3F46;padding:8px 12px;border-radius:8px">Preços</a>
          <a href="#" onClick="{{ goLogin }}" style="font-size:14.5px;font-weight:500;color:#3F3F46;padding:8px 12px;border-radius:8px">Entrar</a>
          <a href="#" onClick="{{ goSignup }}" style="font-size:14.5px;font-weight:600;color:#fff;background:#0A0A0A;padding:9px 16px;border-radius:9px" style-hover="{{ ctaHover }}">Comece grátis</a>
        </nav>
      </div>
    </header>
  </sc-if>

  <main style="flex:1;display:flex;flex-direction:column">
    <sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
      <dc-import name="Landing" go="{{ go }}" hint-size="100%,2400px"></dc-import>
    </sc-if>
    <sc-if value="{{ isPricing }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Pricing" go="{{ go }}" hint-size="100%,1400px"></dc-import>
    </sc-if>
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Auth" go="{{ go }}" tab="{{ authTab }}" hint-size="100%,720px"></dc-import>
    </sc-if>
    <sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="App" go="{{ go }}" hint-size="100%,900px"></dc-import>
    </sc-if>
  </main>

  <sc-if value="{{ showMarketingNav }}" hint-placeholder-val="{{ true }}">
    <footer style="background:#0A0A0A;color:#fff;padding:56px 24px 40px">
      <div style="max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between">
        <div style="max-width:280px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
            <span style="width:28px;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-family:'Satoshi',sans-serif;font-weight:900;font-size:17px">M</span>
            <span style="font-family:'Satoshi',sans-serif;font-weight:700;font-size:19px">Manda</span>
          </div>
          <p style="font-size:14px;line-height:1.6;color:#A1A1AA;margin:0">Propostas comerciais que fecham negócio. Feito pra quem trabalha por conta.</p>
        </div>
        <div style="display:flex;gap:56px;flex-wrap:wrap">
          <div>
            <div style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#71717A;margin-bottom:14px">Produto</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <a href="#" onClick="{{ goLanding }}" style="font-size:14px;color:#D4D4D8">Como funciona</a>
              <a href="#" onClick="{{ goPricing }}" style="font-size:14px;color:#D4D4D8">Preços</a>
              <a href="#" onClick="{{ goSignup }}" style="font-size:14px;color:#D4D4D8">Comece grátis</a>
            </div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#71717A;margin-bottom:14px">Conta</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <a href="#" onClick="{{ goLogin }}" style="font-size:14px;color:#D4D4D8">Login</a>
              <a href="#" style="font-size:14px;color:#D4D4D8">Contato</a>
            </div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#71717A;margin-bottom:14px">Social</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <a href="#" style="font-size:14px;color:#D4D4D8">Instagram</a>
              <a href="#" style="font-size:14px;color:#D4D4D8">LinkedIn</a>
            </div>
          </div>
        </div>
      </div>
      <div style="max-width:1120px;margin:40px auto 0;padding-top:24px;border-top:1px solid #27272A;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <span style="font-size:13px;color:#71717A">© 2026 Manda</span>
        <span style="font-size:13px;color:#71717A">Feito no Brasil 🇧🇷 para freelancers</span>
      </div>
    </footer>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { route: 'landing', authTab: 'signup' };

  go = (dest) => {
    if (dest === 'login') this.setState({ route: 'login', authTab: 'login' });
    else if (dest === 'signup') this.setState({ route: 'login', authTab: 'signup' });
    else this.setState({ route: dest });
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'auto' });
  };

  renderVals() {
    const r = this.state.route;
    return {
      isLanding: r === 'landing',
      isPricing: r === 'pricing',
      isLogin: r === 'login',
      isApp: r === 'app',
      showMarketingNav: r === 'landing' || r === 'pricing',
      authTab: this.state.authTab,
      go: this.go,
      goLanding: (e) => { e && e.preventDefault(); this.go('landing'); },
      goPricing: (e) => { e && e.preventDefault(); this.go('pricing'); },
      goLogin: (e) => { e && e.preventDefault(); this.go('login'); },
      goSignup: (e) => { e && e.preventDefault(); this.go('signup'); },
      ctaHover: { background: '#262626' },
    };
  }
}
</script>
</body>
</html>
